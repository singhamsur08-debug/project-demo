<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Form registration</title>
  </head>
  <body>
    <form name="booking-enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="booking-enquiry" />
      <input name="bot-field" />
      <input name="name" />
      <input name="phone" />
      <input name="eventType" />
      <input name="date" />
      <input name="guests" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
